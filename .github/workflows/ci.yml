name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
  MOVIX_ENABLE_FOUNDATION_SAMPLE: "1"

jobs:
  node-quality:
    name: Node quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:a11y
      - run: pnpm build

  contract-quality:
    name: Contract quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32v1-none
      - run: cargo fmt --manifest-path contracts/Cargo.toml --all --check
      - run: cargo clippy --manifest-path contracts/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path contracts/Cargo.toml
      - run: cargo build --manifest-path contracts/Cargo.toml --release --target wasm32v1-none

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    needs: node-quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
